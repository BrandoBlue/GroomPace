name: Android Debug APK

# Proof Milestone 1: build a sideloadable debug APK in the cloud so you can
# install GroomPace on a real Android phone without setting up Android Studio.
# Download the APK from the run's Artifacts section, then open it on your phone
# (allow "install unknown apps" for your browser/Files app).

on:
  push:
    branches: ['**']
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'manifest.json'
      - 'fonts/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into the native project
        run: npm run sync:www && npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: groompace-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
